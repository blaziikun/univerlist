# ============ on every push and pull request: check, test, build. On main: deploy ============
# Hardened for a public repo: the token this workflow gets can only read; actions are pinned to exact commits (a moved
# tag can't swap in other code; Dependabot keeps the pins current); only the identity guard sees the private words; and
# only the deploy job, only for a push to main, sees the Cloudflare secret. Pull requests from forks run without secrets.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # pinned: "ubuntu-latest" became Ubuntu 26 in October 2026, which Playwright doesn't support yet
    runs-on: ubuntu-24.04
    timeout-minutes: 40 # a normal run takes 10 to 15; anything stuck stops here instead of running for 6 hours
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0, persist-credentials: false } # the whole history, so the secret scan sees every commit
      # a key, token or password in any commit ever made stops everything here. The scanner is a fixed release, checked
      # against its published fingerprint before it runs
      - name: secret scan (gitleaks, every commit)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum --check
          tar xzf gitleaks.tgz gitleaks && ./gitleaks git --log-opts=--all --redact --no-banner . && rm gitleaks gitleaks.tgz
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # my private words in any file, any version in the history, any zip, picture or commit stop everything too. Only on
      # a push to main: the step is the only one given the words, and a pull request's code (which could print them) never
      # runs with them. What a pull request adds is checked when it's merged, before anything deploys
      - name: identity guard
        if: github.event_name == 'push'
        run: node tools/guard.ts
        env:
          PRIVATE_WORDS: ${{ secrets.PRIVATE_WORDS }}
      - run: pnpm audit --prod --audit-level=high   # what ships has no known serious vulnerability
      # only the headless browser the tests use (half the download). The download sometimes stalls: give up after 10
      # minutes rather than hang, and re-run the job
      - run: pnpm exec playwright install --with-deps --only-shell chromium
        timeout-minutes: 10
      - run: pnpm lint                  # Biome (bugs, and the layout every file keeps) and Knip (unused files and packages)
      - run: pnpm check                 # types: the app, its Svelte components, the tests and tools, the Worker
      - run: pnpm test:unit             # the Worker, the proxy, the store
      # what people get, each checked for the browser tests' hook (tools/no-test-hook.ts): it must not be in either
      - run: pnpm build                 # the site
      - run: pnpm build:file            # the one file people download
      # browser tests, against the same two builds with the test hook put in (pnpm build:e2e, dist-e2e/ and
      # dist-file-e2e/); ones that need your own export skip here (it's never in the repo)
      - run: pnpm test:e2e

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    # "production": in Settings › Environments you can limit it to main and require your approval before each deploy
    environment: production
    timeout-minutes: 15
    concurrency: { group: deploy, cancel-in-progress: false } # one deploy at a time, in order
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build                 # the site, without the test hook (the build checks it isn't there)
      - run: pnpm exec wrangler d1 migrations apply ACCOUNTS --remote   # new account tables, if any (none: does nothing)
        if: ${{ vars.SYNC_ON == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
