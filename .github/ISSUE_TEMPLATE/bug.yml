# Something doesn't work. The questions are the ones needed to reproduce it.
name: Something doesn't work
description: A bug, or something that behaves differently from what the guide says
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: "1. Open …\n2. Press …\n3. …"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Firefox 145 on Windows 11, Safari on iPhone
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - univerlist.sayel.dev
        - The one-file version (index.html)
        - My own copy
  - type: markdown
    attributes:
      value: "Please don't attach a real export or backup: it can hold your keys. A screenshot is usually enough."
