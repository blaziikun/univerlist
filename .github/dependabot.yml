# Weekly: a pull request when a package or a GitHub Action has a newer version (security fixes first). CI tests it before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    groups: { minor-and-patch: { update-types: [minor, patch] } }
    # pnpm refuses packages less than a day old (a fresh release is how hijacked packages spread), so wait a few days
    cooldown: { default-days: 3 }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    cooldown: { default-days: 3 }
